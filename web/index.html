<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARWHITE STORE</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { red: '#ef4444', deep: '#b91c1c', crimson: '#dc2626', rose: '#f87171' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px,0px) scale(1)' },
                            '33%': { transform: 'translate(20px,-30px) scale(1.05)' },
                            '66%': { transform: 'translate(-15px,15px) scale(0.95)' },
                            '100%': { transform: 'translate(0px,0px) scale(1)' },
                        },
                        float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-5px)' } },
                        scanline: { '0%': { top: '-2px' }, '100%': { top: '100%' } },
                        ripple: { '0%': { transform: 'scale(0)', opacity: '1' }, '100%': { transform: 'scale(4)', opacity: '0' } },
                    },
                    animation: {
                        blob: 'blob 12s infinite ease-in-out',
                        float: 'float 3s ease-in-out infinite',
                        scanline: 'scanline 3s linear infinite',
                        ripple: 'ripple 0.6s linear',
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #111114;
            overflow: hidden;
            color: #f1f1f1;
        }

        /* ---- Scrollbar ---- */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(239,68,68,0.35); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(239,68,68,0.7); }

        /* ---- Sidebar ---- */
        .sidebar {
            background: linear-gradient(180deg, #1a1a1e 0%, #141417 100%);
            border-right: 1px solid rgba(239,68,68,0.08);
            box-shadow: 4px 0 32px rgba(0,0,0,0.5);
        }

        /* ---- Cards ---- */
        .card {
            background: linear-gradient(135deg, #1e1e23 0%, #18181c 100%);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            border-color: rgba(239,68,68,0.22);
            box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(239,68,68,0.08);
            transform: translateY(-2px);
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(239,68,68,0.4), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .card:hover::before { opacity: 1; }

        /* ---- Slider ---- */
        .slider-track {
            height: 6px;
            border-radius: 999px;
            background: #2a2a30;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .slider-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #7f1d1d, #dc2626, #ef4444);
            box-shadow: 0 0 10px rgba(239,68,68,0.4);
        }
        .slider-thumb {
            width: 18px; height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 12px rgba(239,68,68,0.7), 0 2px 6px rgba(0,0,0,0.4);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .slider-group:hover .slider-thumb {
            transform: scale(1.3) translateY(-50%);
            box-shadow: 0 0 20px rgba(239,68,68,1);
        }

        /* ---- Toggle ---- */
        .toggle-track {
            width: 52px; height: 28px;
            border-radius: 999px;
            transition: all 0.4s ease;
            position: relative;
            cursor: pointer;
        }
        .toggle-track.on {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            box-shadow: 0 0 16px rgba(239,68,68,0.4);
        }
        .toggle-track.off { background: #2a2a30; }
        .toggle-knob {
            position: absolute;
            top: 3px;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: white;
            transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .toggle-track.on .toggle-knob { left: calc(100% - 25px); }
        .toggle-track.off .toggle-knob { left: 3px; }

        /* ---- Select ---- */
        .custom-select {
            appearance: none;
            background: #1a1a1e;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #f1f1f1;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 10px 36px 10px 12px;
            width: 100%;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .custom-select:focus {
            border-color: rgba(239,68,68,0.5);
            box-shadow: 0 0 0 3px rgba(239,68,68,0.1);
        }
        .custom-select option { background: #1a1a1e; }

        /* ---- Visualizer ---- */
        .visualizer {
            background: #0f0f12;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }
        .visualizer::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(239,68,68,0.5), transparent);
            animation: scanline 3s linear infinite;
            top: 0;
            pointer-events: none;
        }
        .viz-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(239,68,68,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(239,68,68,0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .viz-cross-h {
            position: absolute;
            height: 1px; width: 100%;
            background: linear-gradient(90deg, transparent, rgba(239,68,68,0.15), transparent);
            top: 50%;
        }
        .viz-cross-v {
            position: absolute;
            width: 1px; height: 100%;
            background: linear-gradient(180deg, transparent, rgba(239,68,68,0.15), transparent);
            left: 50%;
        }

        /* ---- Nav Item ---- */
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            margin-bottom: 4px;
        }
        .nav-item:hover { background: rgba(239,68,68,0.07); }
        .nav-item.active { background: linear-gradient(90deg, rgba(239,68,68,0.15), rgba(239,68,68,0.04)); }
        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, #ef4444, #b91c1c);
            border-radius: 0 2px 2px 0;
            box-shadow: 0 0 12px rgba(239,68,68,0.6);
        }
        .nav-icon {
            width: 36px; height: 36px;
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .nav-item.active .nav-icon {
            background: rgba(239,68,68,0.15);
            color: #ef4444;
            box-shadow: 0 0 14px rgba(239,68,68,0.2);
        }
        .nav-item:not(.active) .nav-icon {
            background: rgba(255,255,255,0.04);
            color: #6b7280;
        }
        .nav-item.active .nav-label { color: #fff; font-weight: 700; }
        .nav-item:not(.active) .nav-label { color: #6b7280; font-weight: 500; }
        .nav-item:hover:not(.active) .nav-label { color: #9ca3af; }
        .nav-item:hover:not(.active) .nav-icon { background: rgba(255,255,255,0.07); color: #9ca3af; }

        /* ---- Status pill ---- */
        .status-pill {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: all 0.4s ease;
        }
        .status-pill.ready { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); color: #4ade80; }
        .status-pill.saving { background: rgba(234,179,8,0.08); border: 1px solid rgba(234,179,8,0.2); color: #facc15; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; }
        .status-pill.ready .status-dot { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.7); }
        .status-pill.saving .status-dot { background: #eab308; box-shadow: 0 0 6px rgba(234,179,8,0.7); animation: blink 1s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ---- Value badge ---- */
        .value-badge {
            background: #0f0f12;
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 8px;
            padding: 4px 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            color: #ef4444;
            min-width: 64px;
            text-align: center;
        }

        /* ---- Info box ---- */
        .info-box {
            background: rgba(239,68,68,0.04);
            border: 1px solid rgba(239,68,68,0.12);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #6b7280;
            line-height: 1.7;
            position: relative;
            overflow: hidden;
        }
        .info-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(239,68,68,0.3), transparent);
        }

        /* ---- Agent card ---- */
        .agent-card {
            background: #1a1a1e;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .agent-card:hover {
            border-color: rgba(239,68,68,0.35);
            background: #1e1a1a;
            box-shadow: 0 0 20px rgba(239,68,68,0.08);
            transform: translateX(4px);
        }

        /* ---- Color swatch ---- */
        .color-swatch {
            width: 72px; height: 72px;
            border-radius: 16px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .color-swatch.selected { transform: scale(1.12); }
        .color-swatch:not(.selected):hover { transform: scale(1.06); opacity: 0.9; }

        /* ---- Section divider ---- */
        .section-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
            margin: 20px 0;
        }

        /* ---- Shutdown modal ---- */
        .modal-bg {
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(10px);
        }
        .modal-box {
            background: #1a1a1e;
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 20px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(239,68,68,0.05);
        }

        /* ---- Notification ---- */
        .notif {
            background: #1e1e23;
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            animation: float 3s ease-in-out infinite;
        }

        /* ---- Disconnect btn ---- */
        .disconnect-btn {
            background: rgba(239,68,68,0.07);
            border: 1px solid rgba(239,68,68,0.15);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex; align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            width: 100%;
        }
        .disconnect-btn:hover {
            background: rgba(239,68,68,0.14);
            border-color: rgba(239,68,68,0.35);
            box-shadow: 0 0 20px rgba(239,68,68,0.12);
        }

        /* ---- Tab transition ---- */
        .tab-content { animation: tabIn 0.25s ease; }
        @keyframes tabIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* ---- Card header accent ---- */
        .card-header-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(239,68,68,0.3), transparent);
            margin: 14px 0 18px;
        }

        /* ---- Logo spin ---- */
        @keyframes logo-spin { to { transform: rotate(360deg); } }
        .logo-ring { animation: logo-spin 5s linear infinite; }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useRef, useCallback } = React;
const KEY_OPTIONS = ['ALT', 'SHIFT', 'CTRL', 'SPACE', 'Left Mouse', 'Right Mouse', 'Middle Mouse', 'Mouse 4', 'Mouse 5'];
const BASE = 'http://localhost:8080';

/* ================================================================
   SLIDER
================================================================ */
const Slider = ({ label, value, min, max, step = 1, onChange, suffix = "" }) => {
    const pct = Math.max(0, Math.min(100, ((value - min) / (max - min)) * 100));
    let dv = value;
    if (step === 0.001) dv = Number(value).toFixed(3);
    else if (step < 1) dv = Number(value).toFixed(1);

    return (
        <div className="mb-6 slider-group">
            <div className="flex justify-between items-center mb-3">
                <span style={{ fontSize: '11px', fontWeight: 700, letterSpacing: '0.12em', color: '#6b7280', textTransform: 'uppercase' }}>
                    {label}
                </span>
                <div className="value-badge">{dv}{suffix}</div>
            </div>
            <div className="slider-track relative cursor-pointer">
                <div className="slider-fill" style={{ width: `${pct}%` }}></div>
                <input
                    type="range" min={min} max={max} step={step} value={value}
                    onChange={e => onChange(parseFloat(e.target.value))}
                    style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', opacity: 0, cursor: 'pointer', zIndex: 10 }}
                />
                <div className="slider-thumb"
                     style={{ position: 'absolute', top: '50%', transform: 'translateY(-50%)', left: `calc(${pct}% - 9px)`, pointerEvents: 'none', zIndex: 5 }}>
                </div>
            </div>
        </div>
    );
};

/* ================================================================
   TOGGLE
================================================================ */
const Toggle = ({ label, desc, checked, onChange }) => (
    <div
        onClick={() => onChange(!checked)}
        style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '14px 16px', borderRadius: '12px', cursor: 'pointer',
            marginBottom: '14px',
            background: checked ? 'rgba(239,68,68,0.06)' : 'rgba(255,255,255,0.02)',
            border: checked ? '1px solid rgba(239,68,68,0.2)' : '1px solid rgba(255,255,255,0.05)',
            transition: 'all 0.25s ease'
        }}
    >
        <div>
            <div style={{ fontWeight: 600, fontSize: '14px', color: checked ? '#f9fafb' : '#9ca3af', transition: 'color 0.2s' }}>
                {label}
            </div>
            {desc && <div style={{ fontSize: '12px', color: '#4b5563', marginTop: '2px' }}>{desc}</div>}
        </div>
        <div className={`toggle-track ${checked ? 'on' : 'off'}`} onClick={e => { e.stopPropagation(); onChange(!checked); }}>
            <div className="toggle-knob"></div>
        </div>
    </div>
);

/* ================================================================
   SELECT
================================================================ */
const Select = ({ label, value, options, onChange }) => (
    <div style={{ marginBottom: '18px' }}>
        <div style={{ fontSize: '11px', fontWeight: 700, letterSpacing: '0.12em', color: '#6b7280', textTransform: 'uppercase', marginBottom: '8px' }}>
            {label}
        </div>
        <div style={{ position: 'relative' }}>
            <select value={value} onChange={e => onChange(e.target.value)} className="custom-select">
                {options.map(o => <option key={o} value={o}>{o}</option>)}
            </select>
            <div style={{ position: 'absolute', right: '12px', top: '50%', transform: 'translateY(-50%)', color: '#ef4444', pointerEvents: 'none', fontSize: '12px' }}>
                <i className="fas fa-chevron-down"></i>
            </div>
        </div>
    </div>
);

/* ================================================================
   CARD
================================================================ */
const Card = ({ title, icon, children }) => (
    <div className="card" style={{ padding: '22px' }}>
        {title && (
            <>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                        <div style={{
                            width: '34px', height: '34px', borderRadius: '9px',
                            background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.2)',
                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                            color: '#ef4444', fontSize: '14px'
                        }}>
                            {icon}
                        </div>
                        <span style={{ fontWeight: 700, fontSize: '13px', letterSpacing: '0.08em', color: '#e5e7eb' }}>
                            {title}
                        </span>
                    </div>
                    <div style={{ width: '32px', height: '2px', borderRadius: '2px', background: 'linear-gradient(90deg, transparent, rgba(239,68,68,0.6))' }}></div>
                </div>
                <div className="card-header-line"></div>
            </>
        )}
        {children}
    </div>
);

/* ================================================================
   VISUALIZER
================================================================ */
const Visualizer = ({ children }) => (
    <div className="visualizer" style={{ height: '168px', marginBottom: '18px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div className="viz-grid"></div>
        <div className="viz-cross-h"></div>
        <div className="viz-cross-v"></div>
        {children}
    </div>
);

/* ================================================================
   AIMBOT VIEW
================================================================ */
const AimbotView = ({ s, upd }) => (
    <div className="tab-content" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px' }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
            <Card title="GENERAL SETTINGS" icon={<i className="fas fa-sliders-h"></i>}>
                <Toggle label="Enable Aimbot" desc="Master toggle for aim assistance" checked={s.aimbot.active} onChange={v => upd('aimbot','active',v)} />
                <Select label="Activation Key" value={s.aimbot.key} options={KEY_OPTIONS} onChange={v => upd('aimbot','key',v)} />
            </Card>
            <Card title="AIM PRECISION" icon={<i className="fas fa-crosshairs"></i>}>
                <Visualizer>
                    <div style={{
                        position: 'absolute', borderRadius: '50%',
                        width: `${Math.min(s.aimbot.fov * 0.65, 220)}px`,
                        height: `${Math.min(s.aimbot.fov * 0.65, 220)}px`,
                        border: '2px solid rgba(239,68,68,0.7)',
                        boxShadow: '0 0 20px rgba(239,68,68,0.2), inset 0 0 20px rgba(239,68,68,0.05)',
                        transition: 'all 0.2s ease'
                    }}>
                        <div style={{ position: 'absolute', inset: '10px', borderRadius: '50%', border: '1px solid rgba(239,68,68,0.15)' }}></div>
                    </div>
                    <div style={{
                        position: 'absolute', width: '12px', height: '12px', borderRadius: '50%',
                        background: '#ef4444', zIndex: 10,
                        boxShadow: '0 0 14px rgba(239,68,68,1), 0 0 28px rgba(239,68,68,0.5)'
                    }}>
                        <div style={{
                            position: 'absolute', inset: '-4px', borderRadius: '50%',
                            border: '1px solid rgba(239,68,68,0.4)', animation: 'blink 1.5s infinite'
                        }}></div>
                    </div>
                    <div style={{
                        position: 'absolute', bottom: '8px', right: '8px',
                        background: 'rgba(0,0,0,0.8)', border: '1px solid rgba(239,68,68,0.2)',
                        borderRadius: '6px', padding: '3px 8px',
                        fontSize: '10px', fontFamily: 'JetBrains Mono, monospace', color: '#ef4444'
                    }}>FOV: {s.aimbot.fov}°</div>
                </Visualizer>
                <Slider label="Field of View" value={s.aimbot.fov} min={1} max={360} onChange={v => upd('aimbot','fov',v)} suffix="°" />
                <Slider label="Smoothness" value={s.aimbot.smooth} min={1} max={10} step={0.1} onChange={v => upd('aimbot','smooth',v)} />
            </Card>
        </div>
        <div>
            <Card title="HEAD OFFSET" icon={<i className="fas fa-arrows-alt"></i>}>
                <Visualizer>
                    <div style={{
                        position: 'absolute', width: '18px', height: '18px', borderRadius: '50%', zIndex: 10,
                        background: 'linear-gradient(135deg, #ef4444, #b91c1c)',
                        border: '2px solid rgba(255,255,255,0.2)',
                        boxShadow: '0 0 18px rgba(239,68,68,0.8)',
                        transform: `translate(${s.aimbot.head_offset_x * 8}px, ${s.aimbot.head_offset_y * 8}px)`,
                        transition: 'transform 0.08s ease'
                    }}></div>
                    <div style={{
                        position: 'absolute', bottom: '8px', right: '8px',
                        background: 'rgba(0,0,0,0.8)', border: '1px solid rgba(239,68,68,0.2)',
                        borderRadius: '6px', padding: '3px 8px',
                        fontSize: '10px', fontFamily: 'JetBrains Mono, monospace', color: '#ef4444'
                    }}>X:{s.aimbot.head_offset_x} Y:{s.aimbot.head_offset_y}</div>
                </Visualizer>
                <Slider label="X Offset (+ = Right)" value={s.aimbot.head_offset_x} min={-10} max={10} step={1} onChange={v => upd('aimbot','head_offset_x',v)} />
                <Slider label="Y Offset (+ = Down)" value={s.aimbot.head_offset_y} min={-10} max={10} step={1} onChange={v => upd('aimbot','head_offset_y',v)} />
            </Card>
        </div>
    </div>
);

/* ================================================================
   VISUALS VIEW
================================================================ */
const VisualsView = ({ s, upd, onSmoke }) => {
    const colorMap = { purple: '#a855f7', yellow: '#eab308', red: '#ef4444' };
    return (
        <div className="tab-content" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px' }}>
            <Card title="COLOR MODE" icon={<i className="fas fa-palette"></i>}>
                <div style={{ display: 'flex', gap: '16px', justifyContent: 'center', padding: '20px 0 14px' }}>
                    {['purple','yellow','red'].map(c => {
                        const sel = s.colors.current === c;
                        return (
                            <button key={c}
                                onClick={() => upd('colors','current',c)}
                                className={`color-swatch ${sel ? 'selected' : ''}`}
                                style={{
                                    background: `linear-gradient(135deg, ${colorMap[c]}30, ${colorMap[c]}18)`,
                                    borderColor: sel ? colorMap[c] : 'rgba(255,255,255,0.06)',
                                    boxShadow: sel ? `0 0 24px ${colorMap[c]}60, 0 0 60px ${colorMap[c]}25` : 'none'
                                }}>
                                {sel ? (
                                    <i className="fas fa-check" style={{ color: colorMap[c], fontSize: '20px', filter: 'drop-shadow(0 0 6px currentColor)' }}></i>
                                ) : (
                                    <div style={{ width: '28px', height: '28px', borderRadius: '50%', background: colorMap[c], opacity: 0.7 }}></div>
                                )}
                            </button>
                        );
                    })}
                </div>
                <div style={{ textAlign: 'center', fontSize: '11px', fontFamily: 'JetBrains Mono, monospace', color: '#4b5563', letterSpacing: '0.15em' }}>
                    CURRENT: {s.colors.current.toUpperCase()}
                </div>
            </Card>
            <Card title="ANTI-SMOKE AGENT" icon={<i className="fas fa-smog"></i>}>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                    {[
                        { id:'astra', img:'https://img2.pic.in.th/pic/astra.png', label:'ASTRA', desc:'Optimized for Astra Smoke' },
                        { id:'clove', img:'https://img2.pic.in.th/pic/clovefeb8a8055f879efa.png', label:'CLOVE', desc:'Optimized for Clove Smoke' }
                    ].map(ag => (
                        <div key={ag.id} className="agent-card" onClick={() => onSmoke(ag.id)}>
                            <img src={ag.img} alt={ag.label} style={{
                                width: '48px', height: '48px', borderRadius: '50%', objectFit: 'cover', flexShrink: 0,
                                border: '2px solid rgba(239,68,68,0.35)', boxShadow: '0 0 12px rgba(239,68,68,0.25)'
                            }} />
                            <div style={{ flex: 1 }}>
                                <div style={{ fontFamily: 'JetBrains Mono, monospace', fontWeight: 700, fontSize: '15px', color: '#ef4444' }}>{ag.label}</div>
                                <div style={{ fontSize: '12px', color: '#6b7280', marginTop: '2px' }}>{ag.desc}</div>
                            </div>
                            <div style={{ color: '#4b5563', fontSize: '13px' }}><i className="fas fa-chevron-right"></i></div>
                        </div>
                    ))}
                    <div onClick={() => onSmoke('default')} style={{
                        textAlign: 'center', marginTop: '6px', cursor: 'pointer',
                        fontSize: '11px', fontFamily: 'JetBrains Mono, monospace', letterSpacing: '0.15em',
                        color: '#4b5563', paddingBottom: '2px',
                        borderBottom: '1px solid transparent', transition: 'all 0.2s'
                    }}
                        onMouseEnter={e => { e.target.style.color='#ef4444'; e.target.style.borderColor='rgba(239,68,68,0.4)'; }}
                        onMouseLeave={e => { e.target.style.color='#4b5563'; e.target.style.borderColor='transparent'; }}
                    >RESET TO DEFAULT MODE</div>
                </div>
            </Card>
        </div>
    );
};

/* ================================================================
   RECOIL VIEW
================================================================ */
const RecoilView = ({ s, upd }) => (
    <div className="tab-content" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px' }}>
        <Card title="RECOIL CONTROL" icon={<i className="fas fa-gun"></i>}>
            <Toggle label="Enable Recoil Control" checked={s.recoil.active} onChange={v => upd('recoil','active',v)} />
            <Select label="Activation Key" value={s.recoil.key} options={KEY_OPTIONS} onChange={v => upd('recoil','key',v)} />
            <Slider label="Recoil Length" value={s.recoil.length} min={0} max={20} step={1} onChange={v => upd('recoil','length',v)} />
            <Slider label="Recoil Speed" value={s.recoil.speed} min={0.001} max={1} step={0.001} onChange={v => upd('recoil','speed',v)} />
        </Card>
        <Card title="TIMING" icon={<i className="fas fa-clock"></i>}>
            <Slider label="Time to Start (ms)" value={s.recoil.time_to_start} min={0} max={500} step={10} onChange={v => upd('recoil','time_to_start',v)} suffix="ms" />
            <Slider label="Sleep (ms)" value={s.recoil.sleep} min={0} max={50} step={1} onChange={v => upd('recoil','sleep',v)} suffix="ms" />
            <div className="info-box">
                Activates after holding key for <span style={{ color: '#ef4444', fontWeight: 700 }}>{s.recoil.time_to_start}ms</span>. Speed builds up at <span style={{ color: '#ef4444', fontWeight: 700 }}>{Number(s.recoil.speed).toFixed(3)}</span>/tick.
            </div>
        </Card>
    </div>
);

/* ================================================================
   FLICKER VIEW
================================================================ */
const FlickerView = ({ s, upd }) => (
    <div className="tab-content" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px' }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
            <Card title="FLICKER SETTINGS" icon={<i className="fas fa-bolt"></i>}>
                <Toggle label="Enable Flicker" checked={s.flicker.active} onChange={v => upd('flicker','active',v)} />
                <Select label="Activation Key" value={s.flicker.key} options={KEY_OPTIONS} onChange={v => upd('flicker','key',v)} />
            </Card>
            <Card title="FLICKER FOV" icon={<i className="fas fa-crosshairs"></i>}>
                <Visualizer>
                    <div style={{
                        position: 'absolute', borderRadius: '50%', opacity: 0.8,
                        width: `${Math.min(s.flicker.fov * 0.65, 220)}px`,
                        height: `${Math.min(s.flicker.fov * 0.65, 220)}px`,
                        border: '2px dashed rgba(239,68,68,0.6)',
                        boxShadow: '0 0 16px rgba(239,68,68,0.15)',
                        transition: 'all 0.2s ease'
                    }}></div>
                    <div style={{
                        position: 'absolute', width: '12px', height: '12px', borderRadius: '50%',
                        background: '#ef4444', zIndex: 10,
                        boxShadow: '0 0 14px rgba(239,68,68,1), 0 0 28px rgba(239,68,68,0.5)'
                    }}>
                        <div style={{ position: 'absolute', inset: '-4px', borderRadius: '50%', border: '1px solid rgba(239,68,68,0.4)', animation: 'blink 1.5s infinite' }}></div>
                    </div>
                    <div style={{
                        position: 'absolute', bottom: '8px', right: '8px',
                        background: 'rgba(0,0,0,0.8)', border: '1px solid rgba(239,68,68,0.2)',
                        borderRadius: '6px', padding: '3px 8px',
                        fontSize: '10px', fontFamily: 'JetBrains Mono, monospace', color: '#ef4444'
                    }}>FOV: {s.flicker.fov}</div>
                </Visualizer>
                <Slider label="Flicker FOV" value={s.flicker.fov} min={1} max={360} step={1} onChange={v => upd('flicker','fov',v)} />
            </Card>
        </div>
        <Card title="FLICKER BEHAVIOR" icon={<i className="fas fa-sliders-h"></i>}>
            <Slider label="Distance" value={s.flicker.distance} min={0.1} max={10} step={0.1} onChange={v => upd('flicker','distance',v)} suffix="x" />
            <Slider label="Delay Between Shots" value={s.flicker.delay} min={1} max={100} step={1} onChange={v => upd('flicker','delay',v)} suffix="ms" />
            <div className="info-box" style={{ marginTop: '16px' }}>
                Distance <span style={{ color: '#ef4444', fontWeight: 700 }}>{Number(s.flicker.distance).toFixed(1)}x</span> controls overshoot when snapping. Delay <span style={{ color: '#ef4444', fontWeight: 700 }}>{s.flicker.delay}ms</span> between shots.
            </div>
        </Card>
    </div>
);

/* ================================================================
   APP
================================================================ */
const TABS = [
    { id: 'aimbot',  label: 'AIMBOT',  icon: 'fa-crosshairs' },
    { id: 'visuals', label: 'VISUALS', icon: 'fa-eye' },
    { id: 'recoil',  label: 'RECOIL',  icon: 'fa-gun' },
    { id: 'flicker', label: 'FLICKER', icon: 'fa-bolt' },
];

const App = () => {
    const [tab, setTab] = useState('aimbot');
    const [saving, setSaving] = useState(false);
    const [shutModal, setShutModal] = useState(false);
    const [notif, setNotif] = useState(null);
    const [s, setS] = useState({
        aimbot:  { active: true,  key: 'ALT',     head_offset_x: 1, head_offset_y: 3, fov: 45,  smooth: 2.5, speed: 1, sleep: 0 },
        recoil:  { active: false, key: 'ALT',     length: 0, speed: 0.055, time_to_start: 50, sleep: 1, offset: 0 },
        flicker: { active: false, key: 'Mouse 5', fov: 100, delay: 1, distance: 2.5 },
        colors:  { current: 'red' }
    });
    const saveRef = useRef(null);

    useEffect(() => {
        (async () => {
            try {
                const r = await fetch(`${BASE}/api/config`);
                if (r.ok) {
                    const d = await r.json();
                    setS(p => ({ ...p, ...d, recoil: { ...p.recoil, ...d.recoil }, flicker: { ...p.flicker, ...d.flicker }, colors: { ...p.colors, ...d.colors } }));
                }
            } catch { console.log('Backend not reachable. Using defaults.'); }
        })();
        const hb = setInterval(() => fetch(`${BASE}/api/heartbeat`).catch(() => {}), 1000);
        console.log('%c STARWHITE STORE ', 'background:#111114;color:#ef4444;font-size:18px;font-weight:900;padding:10px 20px;border:2px solid #ef4444;border-radius:6px;letter-spacing:4px;');
        return () => clearInterval(hb);
    }, []);

    const autoSave = useCallback((ns) => {
        setSaving(true);
        clearTimeout(saveRef.current);
        saveRef.current = setTimeout(async () => {
            try {
                await fetch(`${BASE}/api/update`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ aimbot: ns.aimbot, recoil: ns.recoil, flicker: ns.flicker, color: ns.colors.current })
                });
            } catch {}
            setSaving(false);
        }, 1000);
    }, []);

    const upd = (cat, key, val) => {
        setS(p => {
            const n = { ...p };
            if (cat === 'colors' && key === 'current') n.colors = { ...n.colors, current: val };
            else n[cat] = { ...n[cat], [key]: val };
            autoSave(n);
            return n;
        });
    };

    const onSmoke = async (mode) => {
        try {
            const r = await fetch(`${BASE}/api/set_anti_smoke`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode }) });
            const d = await r.json();
            if (d.status === 'success') showNotif(`ANTI-SMOKE: ${mode.toUpperCase()}`);
        } catch { showNotif(`ANTI-SMOKE: ${mode.toUpperCase()}`); }
    };

    const doShutdown = async () => {
        try {
            const data = JSON.stringify({ action: 'shutdown', source: 'web_ui' });
            if (navigator.sendBeacon) navigator.sendBeacon(`${BASE}/api/shutdown`, data);
            await fetch(`${BASE}/api/shutdown`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: data });
            window.close();
        } catch { window.close(); }
    };

    const showNotif = (msg) => { setNotif(msg); setTimeout(() => setNotif(null), 3000); };

    return (
        <div style={{ display: 'flex', height: '100vh', overflow: 'hidden', position: 'relative' }}>

            {/* Background blobs */}
            <div style={{ position: 'absolute', top: '-15%', left: '-10%', width: '45%', height: '45%', borderRadius: '50%', background: 'radial-gradient(ellipse, rgba(185,28,28,0.1), transparent 70%)', filter: 'blur(60px)', pointerEvents: 'none', animation: 'blob 12s infinite ease-in-out' }}></div>
            <div style={{ position: 'absolute', bottom: '-15%', right: '-10%', width: '40%', height: '40%', borderRadius: '50%', background: 'radial-gradient(ellipse, rgba(127,29,29,0.08), transparent 70%)', filter: 'blur(60px)', pointerEvents: 'none', animation: 'blob 12s 4s infinite ease-in-out' }}></div>

            {/* ---- SIDEBAR ---- */}
            <div className="sidebar" style={{ width: '240px', display: 'flex', flexDirection: 'column', flexShrink: 0, zIndex: 50 }}>

                {/* Logo */}
                <div style={{ padding: '22px 18px 16px', display: 'flex', alignItems: 'center', gap: '12px' }}>
                    <div style={{ position: 'relative', flexShrink: 0 }}>
                        <div className="logo-ring" style={{ position: 'absolute', inset: '-2px', borderRadius: '50%', background: 'conic-gradient(#ef4444, #b91c1c, #7f1d1d, #b91c1c, #ef4444)', filter: 'blur(1px)', opacity: 0.7 }}></div>
                        <div style={{ position: 'relative', width: '44px', height: '44px', borderRadius: '50%', background: '#1a1a1e', border: '2px solid rgba(239,68,68,0.3)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            <i className="fas fa-star" style={{ color: '#ef4444', fontSize: '16px', filter: 'drop-shadow(0 0 6px rgba(239,68,68,0.8))' }}></i>
                        </div>
                    </div>
                    <div>
                        <div style={{ fontWeight: 900, fontSize: '16px', letterSpacing: '0.04em', background: 'linear-gradient(135deg, #fff 30%, #ef4444 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                            STARWHITE
                        </div>
                        <div style={{ fontSize: '10px', color: '#4b5563', fontWeight: 700, letterSpacing: '0.25em', marginTop: '1px', display: 'flex', alignItems: 'center', gap: '5px' }}>
                            <div style={{ width: '6px', height: '6px', borderRadius: '50%', background: '#ef4444', boxShadow: '0 0 6px rgba(239,68,68,0.8)' }}></div>
                            STORE
                        </div>
                    </div>
                </div>

                <div style={{ height: '1px', background: 'linear-gradient(90deg, transparent, rgba(239,68,68,0.15), transparent)', margin: '0 18px 16px' }}></div>

                {/* Nav */}
                <nav style={{ flex: 1, padding: '0 10px', overflowY: 'auto' }}>
                    {TABS.map(t => (
                        <div key={t.id} className={`nav-item ${tab === t.id ? 'active' : ''}`} onClick={() => setTab(t.id)}>
                            <div className="nav-icon"><i className={`fas ${t.icon}`}></i></div>
                            <span className="nav-label" style={{ fontSize: '13px', letterSpacing: '0.06em' }}>{t.label}</span>
                            {tab === t.id && <div style={{ marginLeft: 'auto', width: '6px', height: '6px', borderRadius: '50%', background: '#ef4444', boxShadow: '0 0 8px rgba(239,68,68,0.8)' }}></div>}
                        </div>
                    ))}
                </nav>

                {/* Bottom */}
                <div style={{ padding: '16px 10px 20px' }}>
                    <div style={{ height: '1px', background: 'linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent)', marginBottom: '14px' }}></div>
                    <div className="disconnect-btn" onClick={() => setShutModal(true)}>
                        <div style={{ width: '32px', height: '32px', borderRadius: '8px', background: 'rgba(239,68,68,0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            <i className="fas fa-power-off" style={{ color: '#ef4444', fontSize: '13px' }}></i>
                        </div>
                        <span style={{ fontSize: '12px', fontWeight: 700, letterSpacing: '0.1em', color: '#ef4444' }}>DISCONNECT</span>
                    </div>
                    <div style={{ textAlign: 'center', marginTop: '12px', fontSize: '10px', color: '#374151', fontFamily: 'JetBrains Mono, monospace', letterSpacing: '0.2em' }}>
                        STARWHITE v2.0
                    </div>
                </div>
            </div>

            {/* ---- MAIN CONTENT ---- */}
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

                {/* Header */}
                <div style={{ height: '76px', padding: '0 36px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
                    <div>
                        <div style={{ fontSize: '26px', fontWeight: 900, letterSpacing: '-0.01em', color: '#f9fafb' }}>{tab.toUpperCase()}</div>
                        <div style={{ fontSize: '11px', fontWeight: 600, color: '#4b5563', letterSpacing: '0.18em', marginTop: '2px' }}>CONFIGURE YOUR PARAMETERS</div>
                    </div>
                    <div className={`status-pill ${saving ? 'saving' : 'ready'}`}>
                        <div className="status-dot"></div>
                        {saving ? 'SYNCING...' : 'SYSTEM READY'}
                    </div>
                </div>

                <div style={{ height: '1px', background: 'linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent)', margin: '0 36px' }}></div>

                {/* Content */}
                <div style={{ flex: 1, overflowY: 'auto', padding: '24px 36px 32px' }}>
                    {tab === 'aimbot'  && <AimbotView s={s} upd={upd} />}
                    {tab === 'visuals' && <VisualsView s={s} upd={upd} onSmoke={onSmoke} />}
                    {tab === 'recoil'  && <RecoilView s={s} upd={upd} />}
                    {tab === 'flicker' && <FlickerView s={s} upd={upd} />}
                </div>
            </div>

            {/* ---- NOTIFICATION ---- */}
            {notif && (
                <div className="notif" style={{
                    position: 'fixed', bottom: '28px', right: '28px', zIndex: 200,
                    display: 'flex', alignItems: 'center', gap: '10px', padding: '12px 18px'
                }}>
                    <div style={{ width: '8px', height: '8px', borderRadius: '50%', background: '#ef4444', boxShadow: '0 0 10px rgba(239,68,68,0.8)', flexShrink: 0 }}></div>
                    <span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: '12px', fontWeight: 700, color: '#f9fafb', letterSpacing: '0.08em' }}>{notif}</span>
                </div>
            )}

            {/* ---- SHUTDOWN MODAL ---- */}
            {shutModal && (
                <div className="modal-bg" style={{ position: 'fixed', inset: 0, zIndex: 300, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <div className="modal-box" style={{ width: '360px', padding: '36px', textAlign: 'center' }}>
                        <div style={{
                            width: '64px', height: '64px', borderRadius: '50%', margin: '0 auto 20px',
                            background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.3)',
                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                            boxShadow: '0 0 24px rgba(239,68,68,0.2)'
                        }}>
                            <i className="fas fa-power-off" style={{ fontSize: '24px', color: '#ef4444' }}></i>
                        </div>
                        <div style={{ fontWeight: 900, fontSize: '20px', color: '#f9fafb', marginBottom: '10px', letterSpacing: '0.02em' }}>TERMINATE SESSION?</div>
                        <div style={{ fontSize: '13px', color: '#6b7280', marginBottom: '28px', lineHeight: 1.6 }}>
                            This will close the configuration panel and stop all background processes.
                        </div>
                        <div style={{ display: 'flex', gap: '12px' }}>
                            <button
                                onClick={() => setShutModal(false)}
                                style={{ flex: 1, padding: '13px', borderRadius: '10px', border: '1px solid rgba(255,255,255,0.08)', background: 'rgba(255,255,255,0.04)', color: '#9ca3af', fontWeight: 700, fontSize: '13px', cursor: 'pointer', letterSpacing: '0.06em', transition: 'all 0.2s' }}
                                onMouseEnter={e => e.target.style.background='rgba(255,255,255,0.08)'}
                                onMouseLeave={e => e.target.style.background='rgba(255,255,255,0.04)'}
                            >CANCEL</button>
                            <button
                                onClick={doShutdown}
                                style={{ flex: 1, padding: '13px', borderRadius: '10px', border: 'none', background: 'linear-gradient(135deg, #dc2626, #b91c1c)', color: '#fff', fontWeight: 700, fontSize: '13px', cursor: 'pointer', letterSpacing: '0.06em', boxShadow: '0 4px 20px rgba(185,28,28,0.5)', transition: 'all 0.2s' }}
                                onMouseEnter={e => { e.target.style.boxShadow='0 6px 28px rgba(239,68,68,0.7)'; e.target.style.transform='translateY(-1px)'; }}
                                onMouseLeave={e => { e.target.style.boxShadow='0 4px 20px rgba(185,28,28,0.5)'; e.target.style.transform='none'; }}
                            >CONFIRM</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
